# hippo-lab only — mounts the 2 TB ORICO CD3520 USB disk (xfs) at
# /var/mnt/immich for Immich's `local` PV and the cluster-backups/ staging dir.
#
# ExistingVolumeConfig, NOT the old `machine.disks` block: it only MOUNTS a
# volume that already exists and never partitions or formats. That matters on
# a fresh install — this disk holds the only copy of Immich's originals and of
# the pre-wipe PVC backups. Mount path is /var/mnt/<name>.
#
# Matched by the filesystem UUID (read 2026-10-06; Seagate ST2000NM0008, serial
# WAIHTO1Z), not by /dev/sdX — Longhorn's iSCSI attachments take sda… and the
# ORICO lands wherever is free (it was sdg).
#
# NO kubelet extraMounts for this path. Talos already passes /var/mnt into the
# kubelet as a propagation slave, so a mount here reaches pods on its own. The
# old Omni-era `extraMounts: /var/mnt/immich (bind, rshared)` broke this on
# 2026-10-06: kubelet bound the EMPTY NVMe directory before the ORICO was
# plugged in, hid the ORICO from every pod, and being rshared, a pod volume
# teardown propagated an unmount back to the host and unmounted the ORICO.
apiVersion: v1alpha1
kind: ExistingVolumeConfig
name: immich
discovery:
  volumeSelector:
    match: volume.uuid == "da4a614e-1fba-4378-8429-13e5ea84422f"
mount:
  readOnly: false
