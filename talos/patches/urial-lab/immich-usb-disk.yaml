# Live in Omni as machine-scoped patch 500-759dfc08-c080-4d9d-b050-b84df3ab6ebb
# ("Add 2TB memory"), urial-lab only.
#
# The ORICO CD3520 USB enclosure holding the 2 TB disk that backs Immich's
# 1800Gi `immich-library` PV (storageClassName: local). Talos partitions and
# mounts it at /var/mnt/immich (xfs, /dev/sda1 as of 2026-09-18) and bind-mounts
# that into the kubelet so the PV's hostPath is visible to pods.
#
# This is the "known gap" omni/README.md flagged: it was live but unrecorded.
# Now recovered verbatim from the Omni ConfigPatch.
#
# The by-id path is the enclosure's USB serial. `File-Stor_Gadget_1234567890`
# is the generic gadget identity the CD3520 presents — it is NOT a placeholder,
# do not "fix" it. Verify with `talosctl -n urial-lab get disks` before reuse.
machine:
  disks:
    - device: /dev/disk/by-id/usb-Linux_File-Stor_Gadget_1234567890-0:0
      partitions:
        - mountpoint: /var/mnt/immich
  kubelet:
    extraMounts:
      - destination: /var/mnt/immich
        type: bind
        source: /var/mnt/immich
        options:
          - bind
          - rshared
          - rw
