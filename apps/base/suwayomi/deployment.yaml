apiVersion: apps/v1
kind: Deployment
metadata:
  name: suwayomi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: suwayomi
  template:
    metadata:
      labels:
        app: suwayomi
    spec:
      securityContext:
        fsGroup: 1000 # www-data group ID
        runAsUser: 1000 # www-data group ID
        runAsGroup: 1000 # www-data group ID

      containers:
        - name: suwayomi
          # Pinned to a STABLE release (github.com/Suwayomi/Suwayomi-Server/releases).
          # Stable and preview builds share the vX.Y.NNNN tag format, so Renovate
          # also offers previews: v2.4.2376 (2026-10-11) crash-looped on a
          # USERACCOUNT 'admin' migration (DbMigrationFailure). Only merge a
          # Renovate bump whose tag is listed as a GitHub release.
          image: ghcr.io/suwayomi/suwayomi-server:v2.4.2366
          ports:
            - containerPort: 4567

          envFrom:
            - configMapRef:
                name: suwayomi-configmap

          # JVM heap is capped via JAVA_TOOL_OPTIONS=-Xmx512m (configmap), and
          # KCEF_ENABLED=false there drops the embedded Chromium + Xvfb (~430Mi
          # of native RSS that -Xmx cannot bound). With KCEF off the pod settles
          # around 300-400Mi; 640Mi is the hard backstop, leaving room for JVM
          # non-heap (metaspace, threads, direct buffers, code cache) on top of
          # the 512Mi heap. Request reflects real steady-state -- 256Mi
          # understated it badly and skewed scheduling on a 2-node cluster.
          resources:
            requests:
              cpu: 25m
              memory: 384Mi
            limits:
              memory: 640Mi

          securityContext:
            allowPrivilegeEscalation: false

          volumeMounts:
            - name: suwayomi-files
              mountPath: /home/suwayomi/.local/share/Tachidesk
            - name: suwayomi-downloads
              mountPath: /home/suwayomi/.local/share/Tachidesk/downloads
      volumes:
        - name: suwayomi-files
          persistentVolumeClaim:
            claimName: suwayomi-files-pvc
        - name: suwayomi-downloads
          persistentVolumeClaim:
            claimName: suwayomi-downloads-pvc
