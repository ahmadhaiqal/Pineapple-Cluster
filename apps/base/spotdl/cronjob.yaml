apiVersion: batch/v1
kind: CronJob
metadata:
  name: spotdl-sync
spec:
  schedule: 0 9 * * *
  timeZone: Asia/Kuala_Lumpur
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 10800
      backoffLimit: 1
      template:
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                    - hippo-lab
          securityContext:
            runAsUser: 911
            runAsGroup: 911
            fsGroup: 911
          initContainers:
          - name: init-dirs
            image: busybox:1.38.0
            command:
            - sh
            - -c
            - mkdir -p /data/media/music
            volumeMounts:
            - &id001
              name: data
              mountPath: /data
          - name: deno
            image: denoland/deno:2.9.7
            command:
            - sh
            - -c
            - cp "$(command -v deno)" /tools/deno
            volumeMounts:
            - &id002
              name: tools
              mountPath: /tools
          containers:
          - name: spotdl
            image: spotdl/spotify-downloader:nightly@sha256:29fb40019560c48ab8e26701b94e2b06eb3b19c380eccf798e66a217be78b91c
            imagePullPolicy: IfNotPresent
            env:
            - name: HOME
              value: /tmp
            - name: UV_CACHE_DIR
              value: /tmp/uv-cache
            - name: PYTHONUNBUFFERED
              value: '1'
            - name: PATH
              value: /tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            command:
            - /bin/sh
            - /config/run.sh
            volumeMounts:
            - *id001
            - name: config
              mountPath: /config
              readOnly: true
            - *id002
          restartPolicy: Never
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: media-pvc
          - name: config
            configMap:
              name: spotdl-playlists
          - name: tools
            emptyDir: {}
