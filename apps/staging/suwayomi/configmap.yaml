apiVersion: v1
kind: ConfigMap
metadata:
  name: suwayomi-configmap

data:
  TZ: "Etc/UTC"
  FLARESOLVERR_ENABLED: "true"
  FLARESOLVERR_URL: "http://flaresolverr.amdhql.org:8191"
  # The image launches `java -jar ...` with no heap flag, so the JVM sizes its
  # heap to a % of visible RAM. With no container limit it saw the whole node
  # and ballooned to ~865Mi. The JVM auto-honors JAVA_TOOL_OPTIONS, so cap the
  # heap here; the deployment's memory limit is the hard backstop.
  JAVA_TOOL_OPTIONS: "-Xmx512m"
  # Suwayomi bundles KCEF (embedded Chromium) + Xvfb for solving Cloudflare
  # challenges. Those are native processes, so -Xmx above does not bound them:
  # measured ~430Mi (Xvfb ~110Mi + 5x jcef_helper ~318Mi). FLARESOLVERR_ENABLED
  # above already covers Cloudflare via the external flaresolverr pod, so the
  # in-container browser is redundant. Disabling it drops the pod from ~600Mi to
  # ~300-400Mi. Trade-off: no in-app WebView, so extensions that need an
  # interactive login or manual challenge solve will not work.
  KCEF_ENABLED: "false"
