ipam:
  mode: kubernetes

kubeProxyReplacement: true

# Single-node cluster: the operator's 2nd replica can never schedule (it
# requires a different node), so run exactly one.
operator:
  replicas: 1

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

k8sServiceHost: localhost
k8sServicePort: 7445

hubble:
  relay:
    enabled: true
  ui:
    enabled: true
    service:
      annotations:
        omni-kube-service-exposer.sidero.dev/port: "5000"
        omni-kube-service-exposer.sidero.dev/label: Hubble

l2announcements:
  enabled: true

k8sClientRateLimit:
  qps: 15
  burst: 20
