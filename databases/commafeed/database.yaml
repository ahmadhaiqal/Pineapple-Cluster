apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: commafeed-db-production-cnpg-v1
spec:
  description: Postgres cluster for the commafeed application
  imageName: quay.io/enterprisedb/postgresql:16.1
  instances: 1

  monitoring:
    enablePodMonitor: true

  inheritedMetadata:
    labels:
      app: commafeed-database
      policy-type: "database"

  storage:
    # Pinned explicitly. These PVCs were created against the cluster's
    # default StorageClass, which is Longhorn (see
    # infrastructure/controllers/base/longhorn/) — relying on the default
    # meant a rebuild could silently bind them to a different provisioner.
    # Changing this does not migrate existing PVCs; it only governs new ones.
    storageClass: longhorn
    size: 1Gi

  bootstrap:
    initdb:
      database: commafeed
      owner: commafeed
      secret:
        name: commafeed-db-creds

  # handy: resources can be used to trigger a redeploy
  resources:
    requests:
      memory: 600Mi
