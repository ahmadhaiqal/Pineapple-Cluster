apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-db-production-cnpg-v1
spec:
  description: Postgres cluster for the immich application
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  instances: 1

  monitoring:
    enablePodMonitor: true

  inheritedMetadata:
    labels:
      app: immich-database
      policy-type: "database"

  storage:
    # Pinned explicitly. These PVCs were created against the cluster's
    # default StorageClass, which is Longhorn (see
    # infrastructure/controllers/base/longhorn/) — relying on the default
    # meant a rebuild could silently bind them to a different provisioner.
    # Changing this does not migrate existing PVCs; it only governs new ones.
    storageClass: longhorn
    size: 5Gi

  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: immich-db-creds
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp"
        - CREATE EXTENSION IF NOT EXISTS "cube"
        - CREATE EXTENSION IF NOT EXISTS "earthdistance"
        - CREATE EXTENSION IF NOT EXISTS "unaccent"
        - CREATE EXTENSION IF NOT EXISTS "vector"

  resources:
    requests:
      memory: 600Mi
